packages:
  - "apps/web"
  - "packages/*"

# Only these dependencies may run install scripts (native binaries).
allowBuilds:
  sharp: true
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@next/env@16.4.4"
  - "@next/eslint-plugin-next@16.4.4"
  - "@vitejs/plugin-react@6.2.1"
  - eslint-config-next@16.4.4
  - next@16.4.4

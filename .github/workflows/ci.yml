name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web — lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Content snapshot and media manifest are up to date
        run: |
          pnpm --filter @hom/web exec tsx scripts/export-content.ts --check
          pnpm --filter @hom/web media:check
      - run: pnpm build

  api:
    name: API — ruff, mypy, pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hom
          POSTGRES_PASSWORD: hom
          POSTGRES_DB: hom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hom" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hom:hom@localhost:5432/hom_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: OpenAPI schema matches the committed client
        run: |
          uv run python -m app.scripts.export_openapi /tmp/openapi.json
          diff -u ../../packages/api-client/openapi.json /tmp/openapi.json

  e2e:
    name: End-to-end (Playwright + axe)
    needs: [web, api]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hom
          POSTGRES_PASSWORD: hom
          POSTGRES_DB: hom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hom" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://hom:hom@localhost:5432/hom
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WEB_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Prepare database
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m app.scripts.seed
      - run: pnpm --filter @hom/web build
      - run: pnpm --filter @hom/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @hom/web exec playwright test --project=desktop --project=mobile --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

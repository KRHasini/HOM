# Local full stack: `docker compose up --build`
# PostgreSQL + API (migrations and idempotent seed on start) + web (production build).
name: hom

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hom}
      POSTGRES_DB: ${POSTGRES_DB:-hom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hom}:${POSTGRES_PASSWORD:-hom}@postgres:5432/${POSTGRES_DB:-hom}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}
      AUTO_SEED: ${AUTO_SEED:-true}
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    environment:
      API_INTERNAL_URL: http://api:8000
      CONTENT_SOURCE: ${CONTENT_SOURCE:-local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
